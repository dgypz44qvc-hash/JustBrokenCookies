name: Deploy JBC Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build slim deploy folder
        run: |
          mkdir -p _deploy/css _deploy/js

          # --- HTML pages (real pages only, no backups) ---
          for f in index.html about.html services.html contact.html \
                    portfolio.html magazine.html mobile-landing.html editor.html; do
            [ -f "$f" ] && cp "$f" _deploy/
          done
          [ -f CNAME ] && cp CNAME _deploy/

          # --- CSS (active files only, no backups) ---
          cp css/style.css _deploy/css/
          cp css/mobile.css _deploy/css/
          [ -f css/mobile-next.css ]      && cp css/mobile-next.css _deploy/css/
          [ -f css/loader.css ]           && cp css/loader.css _deploy/css/
          [ -f css/editor-overrides.css ] && cp css/editor-overrides.css _deploy/css/
          [ -f css/local-editor.css ]     && cp css/local-editor.css _deploy/css/

          # --- JS (active files only, no backups) ---
          cp js/main.js _deploy/js/
          [ -f js/mobile-next.js ]  && cp js/mobile-next.js _deploy/js/
          [ -f js/app.js ]          && cp js/app.js _deploy/js/
          [ -f js/local-editor.js ] && cp js/local-editor.js _deploy/js/
          [ -f js/mobile-editor.js ] && cp js/mobile-editor.js _deploy/js/

          # --- Fonts ---
          [ -d fonts ] && cp -r fonts _deploy/

          # --- ALL images (copy entire folder so nothing gets missed) ---
          cp -r images _deploy/images

          echo "=== Deploy folder size ==="
          du -sh _deploy/
          echo "=== File count ==="
          find _deploy -type f | wc -l

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
